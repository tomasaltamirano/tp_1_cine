<header class="ca-navbar">
  <div class="nav-left">
    <a routerLink="/peliculas" class="brand">
      <div class="logo-icon">CA</div>
      <div class="logo-text">CINE<br />APP</div>
    </a>

    <nav class="nav-links">
      <a routerLink="/peliculas" routerLinkActive="active">CARTELERA</a>
      <a routerLink="/candy-bar">🍿 CANDY</a>
      <a routerLink="/complejo">COMPLEJO</a>
      <a *appSoloRol="['admin']" routerLink="/admin" routerLinkActive="active">ADMIN</a>
    </nav>
  </div>

  <div class="nav-right">
    @switch (auth.rol()) {
      @case ('visitante') {
        <a routerLink="/acceso" class="btn-ingresar">Ingresar</a>
      }
      @case ('anonimo') {
        <span class="saludo">Invitado</span>
        <a routerLink="/registro" class="btn-ingresar">Crear cuenta</a>
        <button type="button" class="btn-texto" (click)="salir()">Salir</button>
      }
      @default {
        <a routerLink="/perfil" class="btn-user" [attr.aria-label]="'Perfil de ' + auth.nombreVisible()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
        <span class="saludo">{{ auth.nombreVisible() }}</span>
        <button type="button" class="btn-texto" (click)="salir()">Salir</button>
      }
    }
  </div>
</header>
